services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: ${DB_USER:-fabi_graph}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fabi_graph_password}
      POSTGRES_DB: ${DB_NAME:-fabi_graph_lab_development}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fabi_graph}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
